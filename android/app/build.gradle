plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

// Private service values are read from the user's Gradle properties.
def quotedSetting = { name, fallback ->
    def value = (project.findProperty(name) ?: fallback).toString()
    return '"' + value.replace('\\', '\\\\').replace('"', '\\"') + '"'
}

android {
    compileSdk 34

    defaultConfig {
        manifestPlaceholders = [AGRIMART_MAPS_API_KEY: (project.findProperty('AGRIMART_MAPS_API_KEY') ?: '').toString()]
        buildConfigField 'String', 'AGRIMART_MAPS_API_KEY', quotedSetting('AGRIMART_MAPS_API_KEY', '')
        buildConfigField 'String', 'AGRIMART_PAYPAL_CLIENT_ID', quotedSetting('AGRIMART_PAYPAL_CLIENT_ID', '')
        applicationId "tw.cgu.b0929035.smallshop"
        minSdk 32
        targetSdk 32
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    namespace 'tw.cgu.b0929035.smallshop'
    buildFeatures {
        buildConfig true
        viewBinding true
    }
}

dependencies {

    implementation 'androidx.appcompat:appcompat:1.4.1'
    implementation 'com.google.android.material:material:1.6.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.1.0-beta04'
    implementation 'com.squareup.picasso:picasso:2.5.2'
    implementation 'com.google.android.gms:play-services-maps:18.1.0'
    implementation 'com.google.firebase:firebase-storage-ktx:20.2.1'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'

    implementation platform('com.google.firebase:firebase-bom:32.2.2')
    implementation 'com.google.firebase:firebase-messaging-ktx:23.2.1'
    implementation 'com.google.firebase:firebase-firestore:24.7.0'
    implementation("androidx.multidex:multidex:2.0.1")

    implementation("com.intuit.sdp:sdp-android:1.0.6")
    implementation("com.intuit.ssp:ssp-android:1.0.6")

    implementation("com.makeramen:roundedimageview:2.3.0")

    implementation("com.squareup.retrofit2:retrofit:2.9.0")
    implementation("com.squareup.retrofit2:converter-scalars:2.9.0")

    implementation 'com.paypal.sdk:paypal-android-sdk:2.16.0'
    implementation 'com.paypal.checkout:android-sdk:1.1.0'
}